<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<title>Memory Palace</title>
<link rel="manifest" href="../manifest.webmanifest">
<script>
  // Arriving from another VR page: the headset can hand over its VR session the moment this page starts loading.
  // Listen before the big scripts load, or the offer is missed and the headset waits on a black screen.
  // The session is asked for right here, inside the offer; the app picks it up once it has loaded.
  window.__xrGranted = false; window.__xrSession = null;
  if (navigator.xr && navigator.xr.addEventListener) navigator.xr.addEventListener('sessiongranted', function () {
    window.__xrGranted = true;
    window.__xrSession = navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    window.__xrSession.catch(function () { window.__xrSession = null; });
    window.dispatchEvent(new Event('xrgranted'));
  });
</script>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('../fonts/bricolage-grotesque.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
  :root { --ink: #f4ead8; --dim: #c9bba1; --panel: rgba(27, 23, 18, 0.72); --line: rgba(244, 234, 216, 0.16); --gold: #d4ad55; --teal: #6cc9d4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1712; color: var(--ink); font: 16px/1.45 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #card { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); width: min(380px, calc(100% - 32px));
    padding: 20px 20px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); }
  #card[hidden] { display: none; }
  .eyebrow { margin: 0 0 2px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  #status { margin: 0 0 16px; color: var(--dim); font-size: 15px; min-height: 2.9em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 16px; font-weight: 600; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(244, 234, 216, 0.08); color: var(--ink); cursor: pointer; }
  button:hover { background: rgba(244, 234, 216, 0.14); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  #enter { background: var(--gold); border-color: var(--gold); color: #1b1712; flex: 1 1 100%; }
  #enter:hover { background: #e2bf6c; }
  .row button:not(#enter) { flex: 1 1 0; }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--dim); }
  #card.arriving .eyebrow::after { content: ' · through the ring'; color: var(--teal); }
  @media (prefers-reduced-transparency: reduce) { #card { background: #1b1712; backdrop-filter: none; -webkit-backdrop-filter: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="The memory palace, seen from its forecourt"></canvas>
<section id="card" aria-live="polite">
  <p class="eyebrow">Endless Clay</p>
  <h1>Memory Palace</h1>
  <p id="status">Raising the palace…</p>
  <div class="row">
    <button id="enter" type="button">Enter the palace</button>
    <button id="home" type="button">Back to Endless Clay</button>
    <button id="planBtn" type="button">Open palace plan</button>
  </div>
  <p class="hint">Walk back through the bronze ring to return. Your plan stays on this device.</p>
  <input id="planFile" type="file" accept=".json,application/json" hidden>
</section>
<script src="../lib/three.min.js"></script>
<script src="sky.js"></script>
<script src="palace.js"></script>
</body>
</html>
